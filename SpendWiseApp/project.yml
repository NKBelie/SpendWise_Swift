name: SpendWiseApp
options:
  bundleIdPrefix: com.spendwise
  deploymentTarget:
    iOS: "17.0"
packages:
  SpendWise:
    path: ..
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: SpendWise
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  SpendWiseApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: DesignSystem
      - path: Models
      - path: Services
      - path: Repositories
      - path: ViewModels
      - path: Views
      - path: Resources
    dependencies:
      - package: SpendWise
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
  SpendWiseAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SpendWiseApp
      - package: SpendWise
schemes:
  SpendWiseApp:
    build:
      targets:
        SpendWiseApp: all
    run:
      config: Debug
    test:
      targets:
        - SpendWiseAppTests
